<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splatbox">
<title>Splatbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b0d10; --stage:#07080a; --sheet:#12151a; --raise:#1a1e25; --raise2:#232832; --line:#262b33;
  --fg:#eef1f4; --mute:#8a94a0; --accent:#ff6a3d; --accent2:#ffb04a; --accent-ink:#1a0b05;
  --ok:#6fcf97; --warn:#f2c14e; --bad:#ff6b6b;
  --font-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-ui)}
[hidden]{display:none!important}
button{font-family:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:12px;font:600 15px var(--font-ui);cursor:pointer;text-align:center;width:100%}
.btn:active{transform:scale(.99)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:transparent}
.btn.small{min-height:40px;font-size:14px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.55;cursor:progress}
.btn:focus-visible,.tool:focus-visible,.ico:focus-visible,.card:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{pointer-events:auto;width:44px;height:44px;display:grid;place-items:center;border:1px solid #ffffff1f;background:#0b0d10b3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fg);border-radius:12px;cursor:pointer;padding:0}
.ico:active{transform:scale(.95)}
.word{font:600 17px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.word i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 14px #ff6a3d88}
.note{margin:0;color:var(--mute);font-size:13px}
.fname{font:12px var(--font-mono);color:var(--mute);overflow-wrap:anywhere}

/* ---------- home ---------- */
#home{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--safe-t)) max(18px,var(--safe-r)) 10px max(18px,var(--safe-l))}
.hscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px max(18px,var(--safe-r)) calc(28px + var(--safe-b)) max(18px,var(--safe-l))}
.hscroll h2{margin:8px 0 14px;font:600 13px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{position:relative;border:1px solid var(--line);background:var(--sheet);border-radius:16px;overflow:hidden;cursor:pointer;color:inherit;text-align:left;padding:0;display:block;min-width:0}
.card:active{transform:scale(.985)}
.card .th{aspect-ratio:4/3;background:#0a0c0d center/cover no-repeat;display:block;width:100%}
.card .meta{padding:10px 12px 12px;display:block}
.card .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dt{display:block;font:11px var(--font-mono);color:var(--mute);margin-top:2px}
.card.new{display:grid;place-items:center;align-content:center;gap:8px;aspect-ratio:auto;min-height:100%;padding:26px 10px;border-style:dashed;border-color:#ffffff30;background:transparent;font-weight:600}
.card.new .plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink)}
.card.new .plus svg{stroke-width:2.4}
.more{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:1px solid #ffffff22;background:#0b0d10b8;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.menu{position:absolute;z-index:5;top:48px;right:8px;min-width:150px;background:var(--raise2);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 12px 30px #000a}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);padding:12px;border-radius:8px;font:500 14px var(--font-ui);cursor:pointer;min-height:44px}
.menu button:active{background:var(--raise)}
.menu button.danger{color:var(--bad)}
.empty{color:var(--mute);margin:0 0 16px;max-width:46ch}
.hfoot{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:30px;font:12px/1.4 var(--font-mono);color:var(--mute)}
.beta .hbar .word::after{content:"BETA";margin-left:10px;padding:2px 8px;border-radius:6px;background:#ffb020;color:#1a1200;font:700 11px var(--font-mono);letter-spacing:.08em}
.hbtns{display:flex;gap:8px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 14px;font:12px/1.4 var(--font-mono);color:var(--mute)}
.fbar button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:36px;cursor:pointer}
.hfoot button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;cursor:pointer}

/* ---------- editor ---------- */
#editor{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--bg)}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:#0a0c0d}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;
  padding:calc(10px + var(--safe-t)) max(12px,var(--safe-r)) 0 max(12px,var(--safe-l))}
.pname{pointer-events:none;flex:1;min-width:0;text-align:center;font:600 14px var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 8px #000c;color:#fff;mix-blend-mode:normal}
.hud{position:absolute;left:max(14px,var(--safe-l));bottom:8px;font:11px var(--font-mono);color:#ffffffaa;pointer-events:none;text-shadow:0 1px 3px #000}
.busy{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.busy.on{display:grid}
.busy span{padding:10px 16px;border-radius:999px;background:#0b0d10e0;border:1px solid var(--line);font:500 13px var(--font-ui);display:flex;gap:10px;align-items:center;color:var(--fg)}
.busy span::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));max-width:calc(100% - 28px);padding:8px 14px;border-radius:12px;background:#0b0d10ee;border:1px solid var(--line);font-size:13px;color:var(--fg);pointer-events:none;text-align:center}
.toast.ok{color:var(--ok)} .toast.warn{color:var(--warn)} .toast.bad{color:var(--bad)}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--sheet);border-top:1px solid var(--line);padding-bottom:var(--safe-b);position:relative;z-index:3}
.tool{appearance:none;border:0;background:transparent;color:var(--mute);min-height:58px;display:grid;place-items:center;align-content:center;gap:2px;font:500 10px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;position:relative;padding:0}
.tool[aria-pressed="true"]{color:var(--fg)}
.tool[aria-pressed="true"]::after{content:"";position:absolute;top:-1px;left:24%;right:24%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent))}

.pop{position:absolute;z-index:4;left:max(10px,var(--safe-l));right:max(10px,var(--safe-r));bottom:8px;max-height:min(54dvh,460px);display:flex;flex-direction:column;
  background:#12151af2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:16px;box-shadow:0 16px 40px #000b;overflow:hidden}
.pop header{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);font:600 13px var(--font-ui);letter-spacing:.1em;text-transform:uppercase}
.pop header button{width:40px;height:40px;border:0;background:transparent;color:var(--mute);border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0}
.pop .body{overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 16px;display:grid;gap:14px;min-width:0}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline}
.sl output{font:13px var(--font-mono);color:var(--mute)}
.sl input[type=range]{grid-column:1/-1;width:100%;margin:2px 0;height:34px;background:transparent;-webkit-appearance:none;appearance:none}
.sl input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
.sl input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
.chk{display:flex;gap:12px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:10px;font:500 13px var(--font-ui);cursor:pointer;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg) inset}
.sw input[type=color]{width:42px;height:38px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:2px}
.lbl{font:500 12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
.txt{width:100%;min-height:46px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:10px;padding:0 12px;font:500 15px var(--font-ui)}
.stats{font:13px var(--font-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media(min-width:760px){
  #editor{grid-template-rows:none;grid-template-columns:72px minmax(0,1fr)}
  .rail{order:-1;grid-auto-flow:row;grid-auto-columns:auto;grid-auto-rows:64px;align-content:start;border-top:0;border-right:1px solid var(--line);padding:calc(8px + var(--safe-t)) 0 0}
  .tool{min-height:64px}
  .tool[aria-pressed="true"]::after{top:22%;bottom:22%;left:-1px;right:auto;width:2px;height:auto;background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .pop{left:12px;right:auto;bottom:auto;top:64px;width:340px;max-height:calc(100% - 84px)}
}
@media(min-width:960px){
  .hscroll{padding-left:max(40px,calc((100% - 1300px)/2));padding-right:max(40px,calc((100% - 1300px)/2))}
  .hbar{padding-left:max(40px,calc((100% - 1300px)/2));padding-right:max(40px,calc((100% - 1300px)/2))}
  .pop{width:360px}
  .card:hover{border-color:#ffffff40}
  .tool:hover,.btn:hover,.seg button:hover,.ico:hover{filter:brightness(1.15)}
  #train .tinfo,#train .trow{width:min(820px,100%);margin:0 auto}
}
.modeseg{pointer-events:auto;display:flex;gap:2px;padding:3px;border:1px solid #ffffff1f;background:#0b0d10b3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px}
.modeseg button{min-height:38px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:600 13px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.modeseg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink)}
.camBtn{pointer-events:auto;min-height:44px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 14px;border:1px solid #ffffff1f;background:#0b0d10b3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;color:#e8ecef;font:600 13px var(--font-ui);cursor:pointer}
.camBtn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:transparent}
.camBtn[hidden]{display:none}
@media(max-width:620px){.pname{display:none}.top{justify-content:space-between}}
#editor.nogui .top,#editor.nogui .rail,#editor.nogui .pop,#editor.nogui .hud{display:none!important}
#editor.nogui{grid-template-columns:minmax(0,1fr)}
#ov{pointer-events:none;z-index:2}.nogui #ov{display:none}
.olist{display:flex;flex-direction:column;gap:4px}
.orow{display:grid;grid-template-columns:38px 1fr auto 38px;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:2px 4px 2px 2px}
.orow[aria-selected="true"]{border-color:var(--accent)}
.orow button{min-height:38px;border:0;background:none;color:var(--fg);font:500 14px var(--font-ui);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .okind{color:var(--mute);font-size:12px}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.num{width:100%;min-height:40px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:8px;padding:0 8px;font:500 14px var(--font-ui)}
#showGui{position:absolute;right:10px;bottom:calc(10px + var(--safe-b));z-index:6;min-height:34px;padding:0 12px;border:1px solid #ffffff24;border-radius:10px;background:#0b0d1099;color:#ffffffa0;font:500 12px var(--font-ui);opacity:.35;cursor:pointer}
#showGui:hover{opacity:1}
#dropHint{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0b0d10d9;border:3px dashed var(--accent);font:600 22px var(--font-ui);pointer-events:none}
.keys{font:12px/1.7 var(--font-mono);color:var(--mute);margin:0}
.keys b{color:var(--fg);font-weight:500}
#tQ{margin:8px 0}
#train{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
#train .tbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
#train .tbar b{font-weight:600}
#tcv{position:static;inset:auto;width:100%;height:100%;min-height:0;object-fit:contain;background:var(--stage);display:block;touch-action:none}
#train .tinfo{padding:12px 16px 4px}
#tStage{font-weight:600}
#tBar{height:8px;border-radius:99px;background:var(--raise2);overflow:hidden;margin:8px 0}
#tFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
#tStats{font:12px var(--font-mono);color:var(--mute);min-height:1.4em}
#tNote{font-size:13px;color:var(--mute);margin:6px 0 0}
#train .trow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 14px}
.card .kind{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:99px;background:#000a;font:11px var(--font-mono)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="home">
  <div class="hbar">
    <div class="word"><i></i>Splatbox</div>
    <span class="hbtns"><button class="ico" id="homeBackup" type="button" aria-label="Back up all projects"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button class="ico" id="homeImport" type="button" aria-label="Import a backup file"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></button>
    <button class="ico" id="homeNew" type="button" aria-label="New project"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></span>
  </div>
  <div class="hscroll" id="hscroll">
    <h2>Projects</h2>
    <div class="fbar" id="fbar" hidden></div>
    <p class="empty" id="emptyMsg" hidden>No projects yet. Start a new project to get an empty 3D space, then add splats, models, photo scans or a photo from the menus.</p>
    <div class="grid" id="grid"></div>
    <div class="hfoot"><span><span id="ver"></span> · <span id="bk"></span></span><span><button id="inst" type="button" hidden>Install app</button> <button id="upd" type="button">Update app</button></span></div>
  </div>
</div>

<div id="editor" hidden>
  <section class="stage" id="stage" aria-label="3D splat viewport">
    <canvas id="gl" aria-label="Splat preview. Left-drag to look around, W A S D to fly, right-drag to slide, double-click to fly to a spot."></canvas>
    <div class="top">
      <button class="ico" id="back" type="button" aria-label="Back to projects"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="modeseg" id="modeSeg" role="group" aria-label="Mode"><button type="button" data-mode="edit" aria-pressed="true">Edit</button><button type="button" data-mode="render" aria-pressed="false">Render</button></div>
      <button class="camBtn" id="camBtn" type="button" hidden aria-pressed="false"></button>
      <div class="pname" id="pname"></div>
      <button class="ico" id="saveBtn" type="button" aria-label="Save project (Ctrl+S)"><svg class="i" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/></svg></button>
      <button class="ico" id="hideGui" type="button" aria-label="Hide the interface (H)"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="ico" id="reset" type="button" aria-label="Reset view"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    </div>
    <button id="showGui" type="button" hidden aria-label="Show the interface (H)">Show interface</button>
    <div id="dropHint" hidden>Drop a .ply or 3D model to add it</div>
    <div class="busy" id="busy"><span id="busyT">Working…</span></div>
    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    <div class="hud" id="hud"></div>
    <div class="pop" id="pop" hidden>
      <header><span id="popT"></span><button id="popX" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="body" id="popB"></div>
    </div>
  </section>
  <nav class="rail" id="rail" aria-label="Tools"></nav>
</div>

<div id="train" hidden>
  <div class="tbar"><button class="ico" id="tBack" type="button" aria-label="Stop and go back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b id="tTitle">Photos</b></div>
  <canvas id="tcv"></canvas>
  <div class="tinfo"><div id="tStage">Getting ready…</div><div class="seg" id="tQ" hidden></div><div id="tBar"><i id="tFill"></i></div><div id="tStats"></div><p id="tNote"></p></div>
  <div class="trow"><button class="btn" id="tPause" type="button" disabled>Pause</button><button class="btn primary" id="tFinish" type="button" disabled>Finish and open</button></div>
</div>
<input id="newIn" type="file" accept="image/*" hidden>
<input id="multiIn" type="file" accept="image/*" multiple hidden>
<input id="cubeIn" type="file" accept=".cube,text/plain" hidden>
<input id="objPly" type="file" accept=".ply" hidden>
<input id="projIn" type="file" accept=".splatbox" multiple hidden>

    var d=out[Object.keys(out)[0]].data,lo=Infinity,hi=-Infinity;

function buildPLY(n,b,mul){

    ["x","y","z","f_dc_0","f_dc_1","f_dc_2","opacity","scale_0","scale_1","scale_2","rot_0","rot_1","rot_2","rot_3"].map(function(p){return "property float "+p}).join("\n")+

    body[q+3]=(b[o+3]-0.5)/SH;body[q+4]=(b[o+4]-0.5)/SH;body[q+5]=(b[o+5]-0.5)/SH;
    body[q+6]=logit;body[q+7]=s;body[q+8]=s;body[q+9]=s;

var MAGIC="SPLATBX1";
function encRec(v,blobs){

  if(v&&typeof v==="object"){var o={};Object.keys(v).forEach(function(k){o[k]=encRec(v[k],blobs)});return o}
  return v;

function packProjects(list){
  var blobs=[],recs=list.map(function(p){return encRec(p,blobs)});
  var head=new TextEncoder().encode(JSON.stringify({format:FORMAT,app:VERSION,exported:Date.now(),recs:recs,sizes:blobs.map(function(b){return b.size}),types:blobs.map(function(b){return b.type})}));
  var len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,head.length,true);
  return new Blob([MAGIC,len,head].concat(blobs),{type:"application/octet-stream"});

function decRec(v,bl){
  if(v&&typeof v==="object"&&v.__blob!=null){var b=bl[v.__blob];if(!v.ta)return Promise.resolve(b);return b.arrayBuffer().then(function(ab){return new (window[v.ta])(ab)})}
  if(Array.isArray(v))return Promise.all(v.map(function(x){return decRec(x,bl)}));

function unpackProjects(file){

    var u=new Uint8Array(b);
    if(b.byteLength<12||String.fromCharCode.apply(null,u.slice(0,8))!==MAGIC)throw new Error("That isn't a Splatbox backup file.");
    var hl=new DataView(b).getUint32(8,true);

      var h=JSON.parse(t);
      if((h.format||1)>FORMAT)throw new Error("This backup was made by a newer Splatbox ("+h.app+"). Update the app first, then import it.");

      return Promise.all(h.recs.map(function(r){return decRec(r,bl)}));

function photoTo3D(src,name,depthCanvas){
  if(!cur)return Promise.resolve();
  var t0=performance.now();
  var depP=depthCanvas?Promise.resolve(depthCanvas):aiCached().then(function(c){
    busy(true,c?"Estimating depth…":"Downloading AI model (about 40 MB, once)…");
    setStatus(c?"":"First run downloads the AI model, about 40 MB. One time only.");
    return getSession();
  }).then(function(sess){
    busy(true,"Estimating depth…");
    return new Promise(function(r){setTimeout(r,40)}).then(function(){return runDepth(sess,src)});
  });
  return depP.then(function(dc){
    busy(true,"Building the 3D…");
    return new Promise(function(r){setTimeout(r,30)}).then(function(){
      var d=makeDots(src,dc,S),bytes=buildPLY(d.n,d.buf,1),blob=new Blob([bytes],{type:"application/octet-stream"}),raw=parsePly(bytes.buffer);
      if(!raw)throw new Error("Nothing came out of that photo. Try a lower Cut far background.");
      if(MODE!=="edit")setMode("edit");
      var o=addSplatObj(raw,name,blob);o.R=rotAxis([1,0,0],Math.PI);
      busy(false);afterAdd(o,"3D ready in "+((performance.now()-t0)/1000).toFixed(1)+" s. Drag to look around.");
    });
  }).catch(function(err){
    busy(false);setStatus("The depth model didn't run here: "+(err&&err.message?err.message:"blocked"),"bad");
  });
}
function makeExample(){
  var s=makeSample();

}

  }).catch(function(err){busy(false);setStatus(err.message,"bad")});
});
$("cubeIn").addEventListener("change",function(e){

  }).catch(function(err){setStatus(err.message,"bad")});
});

window.addEventListener("drop",function(e){
  e.preventDefault();dragN=0;$("dropHint").hidden=true;
  if($("editor").hidden||!cur||!e.dataTransfer)return;
  Array.prototype.forEach.call(e.dataTransfer.files||[],function(f){
    if(/\.ply$/i.test(f.name))addPlyFile(f);else if(/\.(glb|obj)$/i.test(f.name))addMeshFile(f);
  });
});
