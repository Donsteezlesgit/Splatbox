<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splatbox">
<title>Splatbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b0d10; --stage:#07080a; --sheet:#12151a; --raise:#1a1e25; --raise2:#232832; --line:#262b33;
  --fg:#eef1f4; --mute:#8a94a0; --accent:#ff6a3d; --accent2:#ffb04a; --accent-ink:#1a0b05;
  --ok:#6fcf97; --warn:#f2c14e; --bad:#ff6b6b;
  --font-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-ui)}
[hidden]{display:none!important}
button{font-family:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:12px;font:600 15px var(--font-ui);cursor:pointer;text-align:center;width:100%}
.btn:active{transform:scale(.99)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:transparent}
.btn.small{min-height:40px;font-size:14px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.55;cursor:progress}
.btn:focus-visible,.tool:focus-visible,.ico:focus-visible,.card:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{pointer-events:auto;width:44px;height:44px;display:grid;place-items:center;border:1px solid #ffffff1f;background:#0b0d10b3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fg);border-radius:12px;cursor:pointer;padding:0}
.ico:active{transform:scale(.95)}
.word{font:600 17px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.word i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 14px #ff6a3d88}
.note{margin:0;color:var(--mute);font-size:13px}
.fname{font:12px var(--font-mono);color:var(--mute);overflow-wrap:anywhere}

/* ---------- home ---------- */
#home{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--safe-t)) max(18px,var(--safe-r)) 10px max(18px,var(--safe-l))}
.hscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px max(18px,var(--safe-r)) calc(28px + var(--safe-b)) max(18px,var(--safe-l))}
.hscroll h2{margin:8px 0 14px;font:600 13px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{position:relative;border:1px solid var(--line);background:var(--sheet);border-radius:16px;overflow:hidden;cursor:pointer;color:inherit;text-align:left;padding:0;display:block;min-width:0}
.card:active{transform:scale(.985)}
.card .th{aspect-ratio:4/3;background:#0a0c0d center/cover no-repeat;display:block;width:100%}
.card .meta{padding:10px 12px 12px;display:block}
.card .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dt{display:block;font:11px var(--font-mono);color:var(--mute);margin-top:2px}
.card.new{display:grid;place-items:center;align-content:center;gap:8px;aspect-ratio:auto;min-height:100%;padding:26px 10px;border-style:dashed;border-color:#ffffff30;background:transparent;font-weight:600}
.card.new .plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink)}
.card.new .plus svg{stroke-width:2.4}
.more{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:1px solid #ffffff22;background:#0b0d10b8;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.menu{position:absolute;z-index:5;top:48px;right:8px;min-width:150px;background:var(--raise2);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 12px 30px #000a}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);padding:12px;border-radius:8px;font:500 14px var(--font-ui);cursor:pointer;min-height:44px}
.menu button:active{background:var(--raise)}
.menu button.danger{color:var(--bad)}
.empty{color:var(--mute);margin:0 0 16px;max-width:46ch}
.hfoot{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:30px;font:12px/1.4 var(--font-mono);color:var(--mute)}
.hfoot button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;cursor:pointer}

/* ---------- editor ---------- */
#editor{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--bg)}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:#0a0c0d}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;
  padding:calc(10px + var(--safe-t)) max(12px,var(--safe-r)) 0 max(12px,var(--safe-l))}
.pname{pointer-events:none;flex:1;min-width:0;text-align:center;font:600 14px var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 8px #000c;color:#fff;mix-blend-mode:normal}
.hud{position:absolute;left:max(14px,var(--safe-l));bottom:8px;font:11px var(--font-mono);color:#ffffffaa;pointer-events:none;text-shadow:0 1px 3px #000}
.busy{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.busy.on{display:grid}
.busy span{padding:10px 16px;border-radius:999px;background:#0b0d10e0;border:1px solid var(--line);font:500 13px var(--font-ui);display:flex;gap:10px;align-items:center;color:var(--fg)}
.busy span::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));max-width:calc(100% - 28px);padding:8px 14px;border-radius:12px;background:#0b0d10ee;border:1px solid var(--line);font-size:13px;color:var(--fg);pointer-events:none;text-align:center}
.toast.ok{color:var(--ok)} .toast.warn{color:var(--warn)} .toast.bad{color:var(--bad)}

.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sheet);border-top:1px solid var(--line);padding-bottom:var(--safe-b);position:relative;z-index:3}
.tool{appearance:none;border:0;background:transparent;color:var(--mute);min-height:58px;display:grid;place-items:center;align-content:center;gap:2px;font:500 10px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;position:relative;padding:0}
.tool[aria-pressed="true"]{color:var(--fg)}
.tool[aria-pressed="true"]::after{content:"";position:absolute;top:-1px;left:24%;right:24%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent))}

.pop{position:absolute;z-index:4;left:max(10px,var(--safe-l));right:max(10px,var(--safe-r));bottom:8px;max-height:min(54dvh,460px);display:flex;flex-direction:column;
  background:#12151af2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:16px;box-shadow:0 16px 40px #000b;overflow:hidden}
.pop header{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);font:600 13px var(--font-ui);letter-spacing:.1em;text-transform:uppercase}
.pop header button{width:40px;height:40px;border:0;background:transparent;color:var(--mute);border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0}
.pop .body{overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 16px;display:grid;gap:14px;min-width:0}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline}
.sl output{font:13px var(--font-mono);color:var(--mute)}
.sl input[type=range]{grid-column:1/-1;width:100%;margin:2px 0;height:34px;background:transparent;-webkit-appearance:none;appearance:none}
.sl input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
.sl input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
.chk{display:flex;gap:12px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:10px;font:500 13px var(--font-ui);cursor:pointer;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg) inset}
.sw input[type=color]{width:42px;height:38px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:2px}
.lbl{font:500 12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
.txt{width:100%;min-height:46px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:10px;padding:0 12px;font:500 15px var(--font-ui)}
.stats{font:13px var(--font-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media(min-width:760px){
  #editor{grid-template-rows:none;grid-template-columns:72px minmax(0,1fr)}
  .rail{order:-1;grid-template-columns:none;grid-auto-rows:64px;align-content:start;border-top:0;border-right:1px solid var(--line);padding:calc(8px + var(--safe-t)) 0 0}
  .tool{min-height:64px}
  .tool[aria-pressed="true"]::after{top:22%;bottom:22%;left:-1px;right:auto;width:2px;height:auto;background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .pop{left:12px;right:auto;bottom:auto;top:64px;width:340px;max-height:calc(100% - 84px)}
}
@media(min-width:960px){
  .hscroll{padding-left:max(40px,calc((100% - 1300px)/2));padding-right:max(40px,calc((100% - 1300px)/2))}
  .hbar{padding-left:max(40px,calc((100% - 1300px)/2));padding-right:max(40px,calc((100% - 1300px)/2))}
  .pop{width:360px}
  .card:hover{border-color:#ffffff40}
  .tool:hover,.btn:hover,.seg button:hover,.ico:hover{filter:brightness(1.15)}
  #train .tinfo,#train .trow{width:min(820px,100%);margin:0 auto}
}
#dropHint{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0b0d10d9;border:3px dashed var(--accent);font:600 22px var(--font-ui);pointer-events:none}
.keys{font:12px/1.7 var(--font-mono);color:var(--mute);margin:0}
.keys b{color:var(--fg);font-weight:500}
#tQ{margin:8px 0}
#train{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
#train .tbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
#train .tbar b{font-weight:600}
#tcv{position:static;inset:auto;width:100%;height:100%;min-height:0;object-fit:contain;background:var(--stage);display:block;touch-action:none}
#train .tinfo{padding:12px 16px 4px}
#tStage{font-weight:600}
#tBar{height:8px;border-radius:99px;background:var(--raise2);overflow:hidden;margin:8px 0}
#tFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
#tStats{font:12px var(--font-mono);color:var(--mute);min-height:1.4em}
#tNote{font-size:13px;color:var(--mute);margin:6px 0 0}
#train .trow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 14px}
.card .kind{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:99px;background:#000a;font:11px var(--font-mono)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="home">
  <div class="hbar">
    <div class="word"><i></i>Splatbox</div>
    <button class="ico" id="homeNew" type="button" aria-label="New project"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="hscroll" id="hscroll">
    <h2>Projects</h2>
    <p class="empty" id="emptyMsg" hidden>No projects yet. Add a photo, or drop a few photos here to scan them into a 3D scene you can look around, colour, animate and export.</p>
    <div class="grid" id="grid"></div>
    <div class="hfoot"><span id="ver"></span><span><button id="inst" type="button" hidden>Install app</button> <button id="upd" type="button">Update app</button></span></div>
  </div>
</div>

<div id="editor" hidden>
  <section class="stage" id="stage" aria-label="3D splat viewport">
    <canvas id="gl" aria-label="Splat preview. Drag to orbit, pinch to zoom, two fingers to pan, double-tap to reset."></canvas>
    <div class="top">
      <button class="ico" id="back" type="button" aria-label="Back to projects"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pname" id="pname"></div>
      <button class="ico" id="reset" type="button" aria-label="Reset view"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    </div>
    <div id="dropHint" hidden>Drop photos to start a project</div>
    <div class="busy" id="busy"><span id="busyT">Working…</span></div>
    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    <div class="hud" id="hud"></div>
    <div class="pop" id="pop" hidden>
      <header><span id="popT"></span><button id="popX" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="body" id="popB"></div>
    </div>
  </section>
  <nav class="rail" id="rail" aria-label="Tools"></nav>
</div>

<div id="train" hidden>
  <div class="tbar"><button class="ico" id="tBack" type="button" aria-label="Stop and go back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b id="tTitle">Photos</b></div>
  <canvas id="tcv"></canvas>
  <div class="tinfo"><div id="tStage">Getting ready…</div><div class="seg" id="tQ" hidden></div><div id="tBar"><i id="tFill"></i></div><div id="tStats"></div><p id="tNote"></p></div>
  <div class="trow"><button class="btn" id="tPause" type="button" disabled>Pause</button><button class="btn primary" id="tFinish" type="button" disabled>Finish and open</button></div>
</div>
<input id="newIn" type="file" accept="image/*" hidden>
<input id="multiIn" type="file" accept="image/*" multiple hidden>
<input id="swapIn" type="file" accept="image/*" hidden>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var FOV=50*Math.PI/180, TY=Math.tan(FOV/2);
var VERSION="Version 009";

/* ---------- settings ---------- */
var DEF={range:1.9,smooth:4,cut:0,invert:false,fill:1,
  size:1.1,detail:768,shape:0,bg:"#0a0c0d",
  exp:0,con:0,sat:0,hue:0,warm:0,
  fog:0,defocus:0,focus:0.5,sliceA:0,sliceB:1,
  cam:"orbit",dur:6,loop:false,turn:0};
var S=Object.assign({},DEF);

/* ---------- state ---------- */
var photoSrc=null, depthImg=null, photoName="example", cur=null;
var scene=null, zoom=1, panX=0, panY=0, vyaw=0, vpitch=0, lastTyv=Math.tan(25*Math.PI/180), dirty=true, timer=0, anim=null;
var toastT=0;
function setStatus(msg,kind){
  var t=$("toast");clearTimeout(toastT);
  if(!msg){t.hidden=true;return}
  t.textContent=msg;t.className="toast "+(kind||"");t.hidden=false;
  toastT=setTimeout(function(){t.hidden=true},kind==="bad"?9000:4500);
}
function dims(s){return {w:s.naturalWidth||s.width, h:s.naturalHeight||s.height}}
function busy(on,msg){$("busy").classList.toggle("on",!!on);if(msg)$("busyT").textContent=msg}
function aiCached(){return window.caches?caches.match("model/dav2s.1.wasm").then(function(r){return !!r},function(){return false}):Promise.resolve(false)}
function hex2rgb(h){var m=/^#?([0-9a-f]{6})$/i.exec(h||"");var v=m?parseInt(m[1],16):0x0a0c0d;return [(v>>16&255)/255,(v>>8&255)/255,(v&255)/255]}
function toBlob(c,type,q){return new Promise(function(res){c.toBlob(res,type,q)})}
function loadImg(blob){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(blob),im=new Image();
    im.onload=function(){res(im)};im.onerror=function(){rej(new Error("That file isn't an image this browser can read."))};im.src=u;
  });
}

/* ---------- example scene (generated, so the page opens working) ---------- */
function ridge(x,k){
  return Math.sin(x*0.011+k*2.1)*22+Math.sin(x*0.027+k*5.3)*11+Math.sin(x*0.061+k*1.7)*5+Math.sin(x*0.13+k)*2;
}
function makeSample(){
  var W=640,H=400,p=document.createElement("canvas"),d=document.createElement("canvas");
  p.width=d.width=W;p.height=d.height=H;
  var a=p.getContext("2d"),b=d.getContext("2d");
  var g=a.createLinearGradient(0,0,0,H*0.6);g.addColorStop(0,"#9cc3e6");g.addColorStop(1,"#f3e4cf");
  a.fillStyle=g;a.fillRect(0,0,W,H);
  b.fillStyle="#000";b.fillRect(0,0,W,H);
  var layers=[
    {base:190,top:"#b9c6d6",bot:"#dfe3e8",g:0.16},
    {base:222,top:"#8fa2b8",bot:"#bfc9d3",g:0.32},
    {base:262,top:"#60758d",bot:"#8fa0b1",g:0.50},
    {base:306,top:"#3f5a53",bot:"#6c8a7d",g:0.70},
    {base:352,top:"#26382f",bot:"#4a6a55",g:0.90}
  ];
  layers.forEach(function(L,k){
    var path=new Path2D();path.moveTo(0,H);
    for(var x=0;x<=W;x+=4){path.lineTo(x,L.base+ridge(x,k)*(1+k*0.25))}
    path.lineTo(W,H);path.closePath();
    var cg=a.createLinearGradient(0,L.base-40,0,H);cg.addColorStop(0,L.top);cg.addColorStop(1,L.bot);
    a.fillStyle=cg;a.fill(path);
    var dg=b.createLinearGradient(0,L.base-40,0,H);
    var lo=Math.round(255*L.g),hi=Math.round(255*Math.min(1,L.g+0.1));
    dg.addColorStop(0,"rgb("+lo+","+lo+","+lo+")");dg.addColorStop(1,"rgb("+hi+","+hi+","+hi+")");
    b.fillStyle=dg;b.fill(path);
  });
  return {photo:p,depth:d};
}

/* ---------- pixel helpers ---------- */
function grab(src,W,H){
  var c=document.createElement("canvas");c.width=W;c.height=H;
  var x=c.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0,W,H);
  return x.getImageData(0,0,W,H).data;
}

  var ex=Math.pow(2,S.exp/100*1.5),cf=1+S.con/100,sa=1+S.sat/100,wm=S.warm/100*0.09;

/* ---------- in-browser depth model (Depth Anything V2 Small, int8, hosted with this page) ---------- */
var sessionP=null;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){rej(new Error("The depth runtime file didn't load."))};document.head.appendChild(s)})}
function fetchBytes(u){return fetch(u).then(function(r){if(!r.ok)throw new Error("A model file is missing ("+r.status+").");return r.arrayBuffer()})}
function getSession(){
  if(sessionP)return sessionP;
  setStatus("Loading the depth runtime…");
  sessionP=loadScript("lib/ort.wasm.min.js").then(function(){
    ort.env.wasm.wasmPaths=new URL("lib/",document.baseURI).href;ort.env.wasm.numThreads=1;
    setStatus("Downloading the depth model (about 27 MB, first time only)…");
    return Promise.all([fetchBytes("model/dav2s.1.wasm"),fetchBytes("model/dav2s.2.wasm")]);
  }).then(function(p){
    var a=new Uint8Array(p[0].byteLength+p[1].byteLength);a.set(new Uint8Array(p[0]),0);a.set(new Uint8Array(p[1]),p[0].byteLength);
    setStatus("Starting the model…");
    return ort.InferenceSession.create(a,{executionProviders:["wasm"]});
  });
  sessionP.catch(function(){sessionP=null});
  return sessionP;
}
function runDepth(session){
  var pd=dims(photoSrc),sc=420/Math.max(pd.w,pd.h);
  var w=Math.max(14,Math.round(pd.w*sc/14)*14),h=Math.max(14,Math.round(pd.h*sc/14)*14);
  var px=grab(photoSrc,w,h),n=w*h,f=new Float32Array(3*n),m=[0.485,0.456,0.406],sd=[0.229,0.224,0.225],i,c;
  for(i=0;i<n;i++)for(c=0;c<3;c++)f[c*n+i]=(px[i*4+c]/255-m[c])/sd[c];
  return session.run({pixel_values:new ort.Tensor("float32",f,[1,3,h,w])}).then(function(out){
    var d=out[Object.keys(out)[0]].data,lo=Infinity,hi=-Infinity;
    for(i=0;i<n;i++){if(d[i]<lo)lo=d[i];if(d[i]>hi)hi=d[i]}
    var cc=document.createElement("canvas");cc.width=w;cc.height=h;
    var x=cc.getContext("2d"),id=x.createImageData(w,h),sp=(hi-lo)||1;
    for(i=0;i<n;i++){var v=Math.round(255*(d[i]-lo)/sp);id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255}
    x.putImageData(id,0,0);return cc;
  });
}
function doAI(){
  var btn=document.querySelector("[data-act=runAI]"),t0=performance.now();if(btn)btn.disabled=true;
  var cached=false;
  return aiCached().then(function(c){
    cached=c;busy(true,c?"Estimating depth…":"Downloading AI model (about 40 MB)…");
    setStatus(c?"":"First run downloads the AI model, about 40 MB. One time only.");
    return getSession();
  }).then(function(sess){
    busy(true,"Estimating depth…");
    return new Promise(function(r){setTimeout(r,40)}).then(function(){return runDepth(sess)});
  }).then(function(cc){
    depthImg=cc;S.invert=false;schedule();
    toBlob(cc,"image/png").then(function(b){if(cur){cur.depth=b;saveSoon()}});
    setStatus("3D ready in "+((performance.now()-t0)/1000).toFixed(1)+" s. Drag to look around.","ok");
    syncControls();
  }).catch(function(err){
    setStatus("The depth model didn't run here: "+(err&&err.message?err.message:"blocked")+". The rough preview is still shown.","bad");
  }).then(function(){var b=document.querySelector("[data-act=runAI]");if(b)b.disabled=false;busy(false)});
}

/* ---------- export ---------- */
function buildPLY(){
  var n=scene.n,b=scene.buf,mul=S.size,SH=0.28209479177387814;
  var head="ply\nformat binary_little_endian 1.0\nelement vertex "+n+"\n"+
    ["x","y","z","f_dc_0","f_dc_1","f_dc_2","opacity","scale_0","scale_1","scale_2","rot_0","rot_1","rot_2","rot_3"].map(function(p){return "property float "+p}).join("\n")+
    "\nend_header\n";
  var hb=new TextEncoder().encode(head),body=new Float32Array(n*14),i,o,q,s,logit=Math.log(0.98/0.02);
  for(i=0;i<n;i++){
    o=i*7;q=i*14;s=Math.log(Math.max(1e-6,b[o+6]*mul/4.2));
    body[q]=b[o];body[q+1]=-b[o+1];body[q+2]=-b[o+2];
    body[q+3]=(b[o+3]-0.5)/SH;body[q+4]=(b[o+4]-0.5)/SH;body[q+5]=(b[o+5]-0.5)/SH;
    body[q+6]=logit;body[q+7]=s;body[q+8]=s;body[q+9]=s;
    body[q+10]=1;body[q+11]=0;body[q+12]=0;body[q+13]=0;
  }
  var out=new Uint8Array(hb.length+body.byteLength);out.set(hb,0);out.set(new Uint8Array(body.buffer),hb.length);
  return out;
}
function saveBlob(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},60000);
}
function exportPLY(){
  if(!scene||!scene.n){setStatus("Nothing to export yet.","warn");return}
  setStatus("Packing "+scene.n.toLocaleString("en-GB")+" splats…");
  setTimeout(function(){
    try{saveBlob(new Blob([buildPLY()],{type:"application/octet-stream"}),"splatbox-"+photoName+".ply");
      setStatus("Saved splatbox-"+photoName+".ply. Open it in SuperSplat or any splat viewer.","ok")}
    catch(e){setStatus("The save didn't go through: "+(e&&e.message||"unknown"),"bad")}
  },30);
}
function exportPNG(){
  if(!scene)return;
  closeTool();draw(null);
  cv.toBlob(function(b){if(b){saveBlob(b,"splatbox-"+photoName+".png");setStatus("Saved an image of this view.","ok")}else setStatus("Couldn't make the image.","bad")},"image/png");
}
var recorder=null,recChunks=[],recMime="";
function startRecord(){
  if(!scene)return;
  if(!window.MediaRecorder||!cv.captureStream){setStatus("This browser can't record video from the viewer.","bad");return}
  closeTool();
  var types=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  recMime="";types.some(function(t){if(MediaRecorder.isTypeSupported(t)){recMime=t;return true}});
  try{
    recorder=new MediaRecorder(cv.captureStream(30),recMime?{mimeType:recMime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});
  }catch(e){setStatus("Video recording isn't available here.","bad");return}
  recChunks=[];recorder.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data)};
  recorder.onstop=function(){
    var type=(recorder.mimeType||recMime||"video/webm").split(";")[0],ext=type.indexOf("mp4")>=0?"mp4":"webm";
    var blob=new Blob(recChunks,{type:type});
    if(!blob.size){setStatus("The recording came out empty.","bad");return}
    saveBlob(blob,"splatbox-"+photoName+"-"+S.cam+"."+ext);setStatus("Saved video ("+(blob.size/1e6).toFixed(1)+" MB).","ok");
  };
  recorder.start(250);setStatus("Recording…");startAnim(true);
}
function finishRecord(){if(recorder&&recorder.state!=="inactive")setTimeout(function(){recorder.stop()},200)}

/* ---------- projects (saved on this device) ---------- */
var dbP=null;
function db(){
  if(dbP)return dbP;
  dbP=new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error("Saving isn't available in this browser."));
    var r=indexedDB.open("splatbox",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("projects",{keyPath:"id"})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error||new Error("Couldn't open storage."))};
  });
  dbP.catch(function(){dbP=null});
  return dbP;
}
function dbTx(mode,fn){
  return db().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction("projects",mode),r=fn(t.objectStore("projects"));
    t.oncomplete=function(){res(r&&r.result)};t.onerror=t.onabort=function(){rej(t.error||new Error("Storage error."))};
  })});
}
var dbAll=function(){return dbTx("readonly",function(st){return st.getAll()})};
var dbPut=function(p){return dbTx("readwrite",function(st){return st.put(p)})};
var dbDel=function(id){return dbTx("readwrite",function(st){return st["delete"](id)})};
var saveT=0;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(saveNow,700)}
function saveNow(){
  clearTimeout(saveT);
  if(!cur)return Promise.resolve();
  cur.settings=Object.assign({},S);cur.updated=Date.now();
  return dbPut(cur).catch(function(){setStatus("Couldn't save this project on the device.","bad")});
}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fitCanvas(src,maxSide){
  var d=dims(src),sc=Math.min(1,maxSide/Math.max(d.w,d.h)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(d.w*sc));c.height=Math.max(1,Math.round(d.h*sc));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;
}
function prepPhoto(src){
  var pc=fitCanvas(src,1600),tc=fitCanvas(pc,360);
  return Promise.all([toBlob(pc,"image/jpeg",0.9),toBlob(tc,"image/jpeg",0.8)]).then(function(b){return {canvas:pc,photo:b[0],thumb:b[1]}});
}
function newProject(name,src,depthCanvas){

      var p={id:uid(),name:name,created:Date.now(),updated:Date.now(),photo:pp.photo,thumb:pp.thumb,depth:db_,settings:Object.assign({},DEF)};
      return dbPut(p).catch(function(){setStatus("Couldn't save to the device, so this project won't be kept.","warn")}).then(function(){return {p:p,canvas:pp.canvas}});
    });

var plyRaw=null,TR=null;

var QUAL={fast:{n:"Fast",iters:15000,init:150000,max:400000},balanced:{n:"Balanced",iters:30000,init:250000,max:800000},high:{n:"High",iters:60000,init:400000,max:1500000}};

function parsePly(ab){
  var u8=new Uint8Array(ab),head=new TextDecoder("latin1").decode(u8.subarray(0,Math.min(u8.length,16384))),e=head.indexOf("end_header\n");
  if(e<0)return null;
  var off=e+11,n=+((/element vertex (\d+)/.exec(head)||[])[1]||0),props=[],re=/property float (\w+)/g,m,hh=head.slice(0,e);
  while((m=re.exec(hh)))props.push(m[1]);
  var ix={};props.forEach(function(k,j){ix[k]=j});
  var need=["x","y","z","f_dc_0","f_dc_1","f_dc_2","opacity","scale_0","scale_1","scale_2"];
  for(var q=0;q<need.length;q++)if(!(need[q] in ix))return null;
  var st=props.length,f=new Float32Array(ab.slice(off,off+n*st*4)),C0=0.28209479177387814;
  var pos=new Float32Array(n*3),col=new Float32Array(n*3),sz=new Float32Array(n),k=0,i,b,al;
  for(i=0;i<n;i++){
    b=i*st;al=1/(1+Math.exp(-f[b+ix.opacity]));
    if(!(al>0.12))continue;
    var x=f[b+ix.x],y=f[b+ix.y],z=f[b+ix.z];
    if(!isFinite(x+y+z))continue;
    pos[k*3]=x;pos[k*3+1]=y;pos[k*3+2]=z;
    col[k*3]=Math.min(1,Math.max(0,0.5+C0*f[b+ix.f_dc_0]));col[k*3+1]=Math.min(1,Math.max(0,0.5+C0*f[b+ix.f_dc_1]));col[k*3+2]=Math.min(1,Math.max(0,0.5+C0*f[b+ix.f_dc_2]));
    sz[k]=Math.exp((f[b+ix.scale_0]+f[b+ix.scale_1]+f[b+ix.scale_2])/3);
    k++;
  }
  if(!k)return null;
  /* centre + scale so the scene fits the viewer; drop far outliers */
  var cx=0,cy=0,cz=0;for(i=0;i<k;i++){cx+=pos[i*3];cy+=pos[i*3+1];cz+=pos[i*3+2]}
  cx/=k;cy/=k;cz/=k;
  var r=new Float32Array(k);for(i=0;i<k;i++)r[i]=Math.hypot(pos[i*3]-cx,pos[i*3+1]-cy,pos[i*3+2]-cz);
  var samp=[];for(i=0;i<k;i+=Math.max(1,(k/4000)|0))samp.push(r[i]);samp.sort(function(a,b){return a-b});
  var p90=samp[Math.floor(samp.length*0.9)]||1,lim=p90*3.5,sc=0.6/p90,w=0;
  var P=new Float32Array(k*3),Cc=new Float32Array(k*3),Z=new Float32Array(k);
  for(i=0;i<k;i++){
    if(r[i]>lim)continue;
    P[w*3]=(pos[i*3]-cx)*sc;P[w*3+1]=(pos[i*3+1]-cy)*sc;P[w*3+2]=(pos[i*3+2]-cz)*sc;
    Cc[w*3]=col[i*3];Cc[w*3+1]=col[i*3+1];Cc[w*3+2]=col[i*3+2];
    Z[w]=Math.min(0.08,Math.max(0.003,4.2*sz[i]*sc));w++;
  }
  return {n:w,pos:P,col:Cc,sz:Z,total:n};
}
function buildFromRaw(){
  var R=plyRaw;if(!R)return;
  var n=R.n,buf=new Float32Array(n*7),base=new Float32Array(R.col),t=((S.turn|0)%4+4)%4,a=t*Math.PI/2,c=Math.round(Math.cos(a)),sn=Math.round(Math.sin(a)),zc=-(1+1.9/2),i,o;
  for(i=0;i<n;i++){
    var y=R.pos[i*3+1],z=R.pos[i*3+2];
    o=i*7;buf[o]=R.pos[i*3];buf[o+1]=y*c-z*sn;buf[o+2]=zc+(y*sn+z*c);buf[o+6]=R.sz[i];
  }
  scene={n:n,buf:buf,base:base,R:1.9,tx:TY,aspect:1};
  regrade();
  $("hud").textContent=n.toLocaleString("en-GB")+" splats";
  if($("stats"))$("stats").textContent=n.toLocaleString("en-GB")+" splats  ·  shown as dots";
}
function openPhotosProject(p){
  cur=p;S=Object.assign({},DEF,p.settings||{});
  photoName=(p.name||"project").replace(/[^\w-]+/g,"_").slice(0,40)||"project";
  $("pname").textContent=p.name;photoSrc=null;depthImg=null;
  busy(true,"Opening…");
  return p.ply.arrayBuffer().then(function(ab){
    var raw=parsePly(ab);if(!raw)throw new Error("Couldn't read the trained splats in this project.");
    plyRaw=raw;applyRail();resetView();anim=null;showEditor();closeTool();buildFromRaw();dirty=true;busy(false);
  }).catch(function(err){busy(false);setStatus(err.message,"bad")});
}
function smallBlob(file,side){
  var tick=new Promise(function(r){setTimeout(r,30)});
  if(window.createImageBitmap){
    return tick.then(function(){return createImageBitmap(file,{resizeWidth:side,resizeQuality:"medium"})}).then(function(bm){
      var c=document.createElement("canvas");c.width=bm.width;c.height=bm.height;c.getContext("2d").drawImage(bm,0,0);bm.close();
      return toBlob(c,"image/jpeg",0.9).then(function(b){c.width=c.height=1;return b});
    }).catch(function(){return smallBlobOld(file,side)});
  }
  return tick.then(function(){return smallBlobOld(file,side)});
}
function smallBlobOld(file,side){
  return loadImg(file).then(function(im){var c=fitCanvas(im,side),u=im.src;return toBlob(c,"image/jpeg",0.9).then(function(b){try{URL.revokeObjectURL(u)}catch(_){}im.src="";return b})});
}
$("multiIn").addEventListener("change",function(e){
  var files=Array.prototype.slice.call(e.target.files||[]);e.target.value="";
  if(!files.length)return;
  if(files.length<3){setStatus("Pick at least 3 photos. 20 or more of the same place or object, taken from slightly different spots, works best.","warn");return}
  busy(true,"Preparing "+files.length+" photos…");
  var out=[],i=0;
  (function next(){
    if(i>=files.length)return done();
    $("busyT").textContent="Preparing photo "+(i+1)+" of "+files.length+"…";
    smallBlob(files[i],IS_DESK?1600:1024).then(function(b){out.push(b);i++;next()}).catch(function(err){busy(false);setStatus("Couldn't read photo "+(i+1)+": "+err.message,"bad")});
  })();
  function done(){
    loadImg(out[0]).then(prepPhoto).then(function(pp){
      var pr={id:uid(),name:"Photo scan "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"}),created:Date.now(),updated:Date.now(),
        photo:pp.photo,thumb:pp.thumb,depth:null,settings:Object.assign({},DEF,{turn:2}),kind:"photos",srcs:out,ply:null};
      return dbPut(pr).catch(function(){setStatus("Couldn't save to the device, so this scan won't be kept.","warn")}).then(function(){busy(false);return startTraining(pr)});
    }).catch(function(err){busy(false);setStatus(err.message,"bad")});
  }
});

var STAGE_TXT={decode:"Reading photos",features:"Finding features",matching:"Matching photos",pass:"Solving cameras",register:"Placing cameras",solved:"Cameras found",seed:"Making first points",train:"Training"};
function tSet(k,v){var el=$(k);if(el)el.textContent=v}
function fmtEta(sec){if(!isFinite(sec)||sec<0)return "…";var m=Math.floor(sec/60);return m>=1?m+" min":Math.max(1,Math.round(sec))+" s"}
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){if(TR)TR.wake=w;else w.release()}).catch(function(){})}catch(_){}}
document.addEventListener("visibilitychange",function(){if(TR&&!document.hidden)wakeOn()});
function trTeardown(){
  if(!TR)return;var t=TR;TR=null;
  try{if(t.s)t.s.dispose()}catch(_){}
  try{if(t.wake)t.wake.release()}catch(_){}
  $("train").hidden=true;
}
function startTraining(p){
  $("home").hidden=true;$("train").hidden=false;
  tSet("tTitle",p.name);tSet("tStage","Getting ready…");tSet("tStats","");tSet("tNote",IS_DESK?"":"Keep this screen open and the phone awake while it trains. Photo scans take a while on a phone, often 10 to 30 minutes.");$("tQ").hidden=true;
  $("tFill").style.width="0";$("tPause").disabled=true;$("tFinish").disabled=true;$("tPause").textContent="Pause";
  TR={p:p,s:null,wake:null,finishing:false,lost:false,max:10000,confirm:false,started:false};
  var me=TR;
  if(!navigator.gpu){tSet("tStage","WebGPU isn't available in this browser.");tSet("tNote","Open Splatbox in an up-to-date Chrome or Edge. If you're already in one, check that hardware acceleration is on in the browser settings.");$("tPause").disabled=true;return Promise.resolve()}
  var qk="balanced";try{qk=localStorage.getItem("sbq")||"balanced"}catch(_){}if(!QUAL[qk])qk="balanced";
  me.q=IS_DESK?QUAL[qk]:PHONEQ;
  tSet("tStage",p.srcs.length+" photos ready");
  if(IS_DESK){
    var tq=$("tQ");tq.hidden=false;tq.innerHTML=Object.keys(QUAL).map(function(k){return '<button type="button" data-q="'+k+'" aria-pressed="'+(k===qk)+'">'+QUAL[k].n+'</button>'}).join("");
    tSet("tNote","Fast is a quick preview. Balanced is a good default. High is sharpest but takes the longest. Training runs on your graphics card and nothing leaves this PC.");
  }
  $("tPause").textContent="Start training";$("tPause").disabled=false;
  return Promise.resolve();
}
function runTraining(me){
  me.started=true;$("tQ").hidden=true;$("tPause").disabled=true;$("tPause").textContent="Pause";me.max=me.q.iters;wakeOn();
  tSet("tStage","Loading the trainer…");
  return import("./lib/splatjs/index.js").then(function(mod){
    if(TR!==me)return;
    var s=mod.createSession(Object.assign({maxIters:me.max,initTarget:me.q.init,holdout:-1,
      maxViewW:Math.ceil(screen.width||800),maxViewH:Math.ceil(screen.height||800),
      trainer:{maxSplats:me.q.max,capMult:8}},IS_DESK?{sfm:{workers:Math.max(2,Math.min(8,(navigator.hardwareConcurrency||4)-1))}}:{lowMem:true,sfm:{workers:3,uiYield:true}}));
    me.s=s;
    s.on("stage",function(e){
      if(TR!==me||!e)return;
      var lab=STAGE_TXT[e.stage]||e.stage;
      if(e.stage!=="train"){tSet("tStage",lab+(e.total>1?" · "+e.done+" of "+e.total:""));var fr=e.total>0?e.done/e.total:0,w=e.stage==="decode"?3:e.stage==="features"?3+fr*12:e.stage==="matching"?15+fr*10:(e.stage==="pass"||e.stage==="register")?25+fr*10:35;$("tFill").style.width=w+"%"}
    });
    s.on("metrics",function(m){
      if(TR!==me||!m)return;
      var it=m.iter||0,ips=m.itersPerSec||0,eta=ips>0?(me.max-it)/ips:NaN;
      tSet("tStage","Training · "+Math.min(100,Math.round(it/me.max*100))+"%");
      $("tFill").style.width=(35+Math.min(1,it/me.max)*65)+"%";
      tSet("tStats",(m.splats||0).toLocaleString("en-GB")+" splats · "+Math.round(ips)+" it/s · about "+fmtEta(eta)+" left"+(m.psnrTrain?" · PSNR "+(+m.psnrTrain).toFixed(1):""));
    });
    s.on("log",function(m){if(TR===me&&typeof m==="string")tSet("tNote",m.slice(0,140))});
    s.on("event",function(e){
      if(TR!==me||!e)return;
      if(e.kind==="train-complete")finishTraining();
      else if(e.kind==="device-lost"){me.lost=true;tSet("tStage","The phone took back the graphics chip");tSet("tNote","This usually happens when the screen locks or you switch apps. Your cameras are kept, so you can restart training without redoing that part.");$("tPause").textContent="Restart training";$("tPause").disabled=false;$("tFinish").disabled=true}
    });
    return s.load(me.p.srcs).then(function(){return s.solve()}).then(function(){return s.seed()}).then(function(){
      if(TR!==me)return;
      attachView(me);
      s.start();$("tPause").disabled=false;$("tFinish").disabled=false;
    });
  }).catch(function(err){
    if(TR!==me)return;
    tSet("tStage","Training stopped");var em=(err&&err.message)||"Something went wrong.";tSet("tNote",/adapter|WebGPU/i.test(em)?"This phone's browser has WebGPU switched off or unsupported ("+em+"). Photo scans can't train here.":em);
  });
}
function attachView(t){
  try{
    var cvs=$("tcv"),meta=t.s.trainer.camMeta&&t.s.trainer.camMeta[0];
    if(meta){cvs.width=meta.w;cvs.height=meta.h;cvs.style.objectFit="contain"}
    t.s.view.attach(cvs);
    if(meta)t.s.view.lookThrough(0);
  }catch(err){tSet("tNote","Training is running, but the live preview couldn't start: "+err.message)}
}
function finishTraining(){
  var t=TR;if(!t||t.finishing||!t.s)return;t.finishing=true;
  busy(true,"Packing the splats…");
  Promise.resolve(t.s.training?t.s.finish():null).then(function(){return t.s.exportPlyBlob()}).then(function(blob){
    t.p.ply=blob;t.p.updated=Date.now();
    return dbPut(t.p).catch(function(){setStatus("Couldn't save the result on the device. Opening it anyway.","warn")}).then(function(){return t.p});
  }).then(function(p){trTeardown();busy(false);return openPhotosProject(p)}).catch(function(err){
    busy(false);if(TR===t){t.finishing=false;tSet("tNote","Couldn't pack the result: "+err.message)}
  });
}
$("tQ").addEventListener("click",function(e){

$("tPause").addEventListener("click",function(){

    t.s.recover().then(function(){t.lost=false;attachView(t);t.s.start();$("tPause").textContent="Pause";$("tPause").disabled=false;$("tFinish").disabled=false})
      .catch(function(err){tSet("tNote","Couldn't restart: "+err.message)});
    return;
  }

});
